name: cf-probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "== verify =="
          curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({'success':d.get('success'),'errors':d.get('errors'),'status':d.get('result',{}).get('status')}))"
          echo "== zones =="
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?per_page=50" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({'success':d.get('success'),'errors':d.get('errors'),'zones':[[z['name'],z['id']] for z in d.get('result',[]) or []]}))"
          echo "== account memberships =="
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/memberships" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({'success':d.get('success'),'errors':d.get('errors'),'accts':[[m['account']['name'],m['account']['id']] for m in d.get('result',[]) or []]}))"
          echo "== create zone =="
          curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data "{\"name\":\"jaxsystems.ai\",\"account\":{\"id\":\"$CF_ACCOUNT\"},\"type\":\"full\"}" \
            https://api.cloudflare.com/client/v4/zones | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or {}; print(json.dumps({'success':d.get('success'),'errors':d.get('errors'),'ns':r.get('name_servers'),'id':r.get('id'),'status':r.get('status')}))"
